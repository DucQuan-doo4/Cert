services:
  exam-master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exam-master-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATA_DIR=/app/server/data
      - GITHUB_DATA_REPO=https://github.com/DucQuan-doo4/Cert.git
    volumes:
      # Mount local data directory containing 85 exam JSON files (17.8k questions)
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => { if (r.statusCode !== 200) process.exit(1); })"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
